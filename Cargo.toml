[workspace]
members = [
    "crates/qos-types",
    "crates/arch/riscv-rs",
    "crates/kernel/qos-kernel",
    "crates/uefi",
]
resolver = "2"

[workspace.dependencies]
qos-types = { path = "crates/qos-types" }
qos-kernel = { path = "crates/kernel/qos-kernel" }
riscv-rs = { path = "crates/arch/riscv-rs" }
uefi = { path = "crates/uefi" }